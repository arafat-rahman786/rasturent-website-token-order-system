<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Token</title>
  <link rel="stylesheet" href="./src/style.css">
</head>

<body class="min-h-screen bg-slate-50 text-slate-900">

  <!-- Header -->
  <header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl items-center justify-between px-5 py-4">

      <!-- Logo -->
      <a href="index.html" class="text-xl font-black tracking-tight">
        Food<span class="text-orange-500">Point</span>
      </a>

      <!-- Home -->
      <a
        href="index.html"
        class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-semibold transition hover:border-orange-500 hover:text-orange-500"
      >
        Home
      </a>

    </div>
  </header>


  <!-- Main -->
  <main class="mx-auto flex min-h-[calc(100vh-73px)] max-w-5xl items-center justify-center px-5 py-12">

    <div class="w-full max-w-xl">

      <!-- Heading -->
      <div class="mb-8 text-center">
        <p class="mb-2 text-sm font-bold uppercase tracking-[0.2em] text-orange-500">
          Live Queue
        </p>

        <h1 class="text-3xl font-black tracking-tight sm:text-4xl">
          Your Live Token
        </h1>

        <p class="mt-3 text-sm leading-6 text-slate-500">
          আপনার অর্ডারের বর্তমান token status এখানে দেখতে পারবেন।
        </p>
      </div>


      <!-- Token Card -->
      <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">

        <!-- Status -->
        <div class="flex items-center justify-between">
          <span class="rounded-full bg-green-50 px-3 py-1 text-xs font-bold text-green-600">
            LIVE
          </span>

          <span class="text-sm text-slate-400">
            #TOKEN-1024
          </span>
        </div>


        <!-- Main Token -->
        <div class="py-10 text-center">

          <p class="text-sm font-medium text-slate-400">
            Current Token
          </p>

          <h2 id="tokenTimer" class="mt-2 text-7xl font-black tracking-tight text-orange-500 sm:text-8xl">
            00:00
          </h2>

          <p class="mt-3 text-sm text-slate-500">
            Please wait for your token to be called
          </p>

        </div>


        <!-- Info -->
        <div class="grid grid-cols-2 gap-3">

          <div class="rounded-2xl bg-slate-50 p-4">
            <p class="text-xs font-medium text-slate-400">
              Your Token
            </p>

            <p id="simpleToken" class="mt-1 text-lg font-bold">
              #24
            </p>
          </div>


          <div class="rounded-2xl bg-slate-50 p-4">
            <p class="text-xs font-medium text-slate-400">
              Price
            </p>

            <p id="price" class="mt-1 text-lg font-bold">
              000
            </p>
          </div>

        </div>


        <!-- Progress -->
        <div class="mt-6">

          <div class="mb-2 flex items-center justify-between text-xs">
            <span class="font-semibold text-slate-600">
              Queue Progress
            </span>

            <span class="font-bold text-orange-500">
              75%
            </span>
          </div>

          <div class="h-2 overflow-hidden rounded-full bg-slate-100">
            <div class="h-full w-3/4 rounded-full bg-orange-500"></div>
          </div>

        </div>


        <!-- Refresh -->
        <button
          type="button"
          class="mt-7 w-full rounded-2xl bg-orange-500 px-5 py-3.5 text-sm font-bold text-white transition hover:bg-orange-600"
        >
          Refresh Token
        </button>

      </section>


      <!-- Small Note -->
      <p class="mt-5 text-center text-xs leading-5 text-slate-400">
        Token status automatically changes when the next order is served.
      </p>

    </div>

  </main>
 <script type="module" src="./src/main.ts"></script>
</body>
</html>
